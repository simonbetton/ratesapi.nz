name: Scheduled Rate Collection

on:
  schedule:
    # Every four hours (UTC), away from the busy start of the hour. Runs can be delayed.
    - cron: "17 */4 * * *"
  push:
    branches:
      - main
  pull_request:
    paths:
      - "apps/api/bin/**"
      - "apps/api/src/models/**"
      - "apps/api/src/lib/data-loader.ts"
      - "apps/api/src/lib/schema.ts"
      - "apps/api/package.json"
      - "bun.lock"
      - ".github/workflows/scrape.yml"
      - ".github/scripts/report-collection.ts"
      - ".github/scripts/wait-for-deployment.sh"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect and validate without database credentials or writes
        type: boolean
        default: false

# Do not overlap production runs. Dry runs cannot delay production publication.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && format('rate-audit-{0}', github.ref) || 'production-rate-publication' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify deployment and prepare database
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Wait for this commit to deploy successfully
        run: bash .github/scripts/wait-for-deployment.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify D1 access
        working-directory: apps/api
        run: bunx wrangler d1 execute ratesapi-data --remote --command="SELECT name FROM sqlite_master WHERE type='table';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional backwards-compatible freshness migration; run once before writers.
      - name: Migrate the D1 schema
        working-directory: apps/api
        continue-on-error: true
        run: bun bin/migrate-d1.ts
        env:
          D1_DATABASE_NAME: ratesapi-data
          D1_REMOTE: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  collect:
    name: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'Dry run' || 'Collect' }} ${{ matrix.dataset }}
    needs: prepare
    # Only trusted repository branches can use the browser secret for a live audit.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'pull_request' || inputs.dry_run || needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Bound browser-host load. Each category writes distinct D1 keys.
      max-parallel: 2
      matrix:
        dataset:
          [
            mortgage-rates,
            personal-loan-rates,
            car-loan-rates,
            credit-card-rates,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: apps/api
        run: bunx playwright install --with-deps chromium
      # Tests run in CI before deployment, never as a scheduled collection prerequisite.
      - name: Collect and validate without publishing
        id: dry-run
        if: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
        working-directory: apps/api
        run: node --max-http-header-size=65536 --import tsx "bin/scrape-${RATES_DATASET}.ts" --dry-run
        env:
          RATES_DATASET: ${{ matrix.dataset }}
          RATES_BROWSER: auto
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
      - name: Collect and publish verified institutions
        id: publish
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.dry_run }}
        working-directory: apps/api
        run: node --max-http-header-size=65536 --import tsx "bin/scrape-${RATES_DATASET}.ts"
        env:
          CI: "true"
          RATES_DATASET: ${{ matrix.dataset }}
          RATES_BROWSER: auto
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          D1_DATABASE_NAME: ratesapi-data
          D1_REMOTE: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload collection and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-coverage-${{ matrix.dataset }}
          path: |
            apps/api/direct-source-report.json
            apps/api/direct-source-report-browser.json
            apps/api/direct-run-failure.json
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report collection failures
    needs: [prepare, collect]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the reporting job can comment. It receives no browser or database secrets.
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download collection evidence
        uses: actions/download-artifact@v4
        # Setup failures can leave no artifact; report the failed job instead.
        continue-on-error: true
        with:
          pattern: source-coverage-*
          path: rate-reports
      - name: Comment on the PR or collected commit
        run: node .github/scripts/report-collection.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_RESULT: ${{ needs.collect.result }}
          COLLECTION_DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run || false }}
