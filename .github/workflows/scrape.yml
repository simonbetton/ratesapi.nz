name: Hourly Scraping and Database Updates

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

# Never overlap database writers, including manual and scheduled runs.
concurrency:
  group: production-rate-publication
  cancel-in-progress: false

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # Cloudflare secrets are scoped to the steps that talk to D1, so dependency
    # installs and checks never run with them in the environment.
    env:
      CI: "true"
      D1_DATABASE_NAME: ratesapi-data
      D1_REMOTE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for remote browser connections
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium and system dependencies
        working-directory: apps/api
        run: bunx playwright install --with-deps chromium

      - name: Check
        run: bun run check

      # New mortgage terms require the matching API schema to be live first.
      # This also protects hourly/manual runs after a failed deployment.
      - name: Wait for this commit to deploy successfully
        run: bash .github/scripts/wait-for-deployment.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify D1 database access
        working-directory: apps/api
        run: |
          echo "Verifying D1 database access for database: ratesapi-data"
          npx wrangler d1 list
          echo "Testing database connectivity:"
          npx wrangler d1 execute ratesapi-data --remote --command="SELECT name FROM sqlite_master WHERE type='table';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Adds latest_data.last_checked when it is missing. The scrapers still
      # save data without the column, so a failed migration must not stop them.
      - name: Migrate the D1 schema
        working-directory: apps/api
        continue-on-error: true
        run: bun bin/migrate-d1.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify browser collector
        run: RUN_BROWSER_TESTS=1 bun test apps/api/test/browser-sources.test.ts

      - name: Collect and publish verified institution sources
        working-directory: apps/api
        run: bun run scrape
        env:
          RATES_BROWSER: auto
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload direct source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-source-coverage
          path: |
            apps/api/direct-source-report.json
            apps/api/direct-source-report-browser.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify saved data
        working-directory: apps/api
        run: |
          npx wrangler d1 execute ratesapi-data --remote --command="SELECT data_type, last_updated FROM latest_data ORDER BY data_type"
          npx wrangler d1 execute ratesapi-data --remote --command="SELECT data_type, date, COUNT(*) as count FROM historical_data GROUP BY data_type, date ORDER BY date DESC LIMIT 10"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
