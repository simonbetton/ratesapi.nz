name: Direct institution source checks

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser host (auto tries Chromium, then Cloud if a key is configured)
        type: choice
        options: [auto, local, cloud]
        default: auto
      institutions:
        description: All sources, or comma-separated institution IDs for access diagnostics
        type: string
        default: all
  pull_request:
    paths:
      - "apps/api/bin/direct/**"
      - "apps/api/bin/audit-browser-sources.ts"
      - "apps/api/bin/audit-direct-sources.ts"
      - "apps/api/bin/utils.ts"
      - "apps/api/test/browser-sources.test.ts"
      - "apps/api/test/direct-sources.test.ts"
      - "apps/api/test/partial-publication.test.ts"
      - "apps/api/test/browser-source-workflow.test.ts"
      - "apps/api/test/fixtures/direct/**"
      - ".github/workflows/browser-sources.yml"
      - "apps/api/package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: browser-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-tests:
    name: Browser and partial-publication tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js for remote browser connections
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: apps/api
        run: bunx playwright install --with-deps chromium
      - name: Test browser lifecycle, extraction and partial publication
        id: source-tests
        run: >-
          RUN_BROWSER_TESTS=1 bun test apps/api/test/browser-sources.test.ts apps/api/test/direct-sources.test.ts apps/api/test/partial-publication.test.ts apps/api/test/browser-source-workflow.test.ts

  live-source-audit:
    name: Manual live-source health audit
    # Live source availability is separate from PR correctness and can incur
    # Browser Use charges. It requires an explicit manual run, never a PR push.
    if: github.event_name == 'workflow_dispatch'
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js for remote browser connections
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: apps/api
        run: bunx playwright install --with-deps chromium
      - name: Audit live sources (no database credentials or writes)
        id: live-audit
        working-directory: apps/api
        run: |
          if [ "$RATES_INSTITUTIONS" = "all" ]; then
            bun run sources:audit
          else
            bun run sources:browser
          fi
        env:
          RATES_BROWSER: ${{ inputs.browser || 'auto' }}
          RATES_INSTITUTIONS: ${{ inputs.institutions || 'all' }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
      - name: Upload access and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-source-report
          path: |
            apps/api/browser-source-report.json
            apps/api/direct-source-report.json
            apps/api/direct-source-report-browser.json
          if-no-files-found: warn
          retention-days: 14
