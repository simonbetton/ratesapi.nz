name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

# Keep the three-Worker deployment intact. A queued stale run checks main again
# immediately before deployment; queue order need not match commit order.
concurrency:
  group: production-worker-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The docs sitemap reads each page's last commit date from git history.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Deploy API, docs, and web Workers to Cloudflare
        run: |
          bash .github/scripts/assert-current-main.sh
          bun run deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Tells Bing and other IndexNow engines about the deployed pages. The
      # script never fails, and a failed ping must not fail the deploy.
      - name: Ping IndexNow
        run: bun run --cwd apps/web indexnow
        continue-on-error: true
