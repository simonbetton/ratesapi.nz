name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run check
        run: bun run check

      # Exercise the production SQL runner on Linux, including oversized batches
      # and rollback. Uses a throwaway local database with no Cloudflare secrets.
      - name: Verify D1 persistence
        run: bun test apps/api/test/d1-persistence.integration.test.ts
        env:
          RUN_D1_LOCAL_TESTS: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all apps
        run: bun run build
