name = "ratesapi-nz-web"
main = "src/server.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# The landing page is the origin for both hostnames. The API and docs Workers
# claim their paths with routes, which run before a Custom Domain Worker.
[[routes]]
pattern = "www.ratesapi.nz"
custom_domain = true

# src/server.ts redirects the apex to www.
[[routes]]
pattern = "ratesapi.nz"
custom_domain = true

# src/lib/canonical-url.ts moves every old docs.ratesapi.nz page to its new
# home in one hop. This only takes effect once the Cloudflare dashboard
# redirect rule for docs.ratesapi.nz is removed: that rule runs first and sends
# every path to the homepage.
[[routes]]
pattern = "docs.ratesapi.nz/*"
zone_name = "ratesapi.nz"

# The homepage's key facts are read from the API Worker (apps/api) at render
# time. Locally the binding has no API Worker to reach, so the page falls back
# to static wording.
[[services]]
binding = "RATES_API"
service = "ratesapi-nz"

[observability.logs]
enabled = true
invocation_logs = true
