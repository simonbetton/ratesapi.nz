name = "ratesapi-nz-web"
main = "src/server.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# The landing page is the origin for both hostnames. The API and docs Workers
# claim their paths with routes, which run before a Custom Domain Worker.
[[routes]]
pattern = "www.ratesapi.nz"
custom_domain = true

# src/server.ts redirects the apex to www.
[[routes]]
pattern = "ratesapi.nz"
custom_domain = true

[observability.logs]
enabled = true
invocation_logs = true
