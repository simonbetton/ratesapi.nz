name = "ratesapi-nz-docs"
main = ".open-next/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Next.js serves the docs under basePath /docs. This route runs before the
# landing page Worker, which owns the www.ratesapi.nz Custom Domain. The
# trailing * matches /docs, /docs?query and all paths under /docs/.
[[routes]]
pattern = "www.ratesapi.nz/docs*"
zone_name = "ratesapi.nz"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true
