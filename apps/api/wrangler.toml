name = "ratesapi-nz"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# www.ratesapi.nz is the canonical host. The apex routes stay so existing API
# and MCP clients keep working: these routes run before the landing page Worker,
# which redirects every other apex request to www.
#
# The API Worker claims all of /api, not only /api/v1, so that a request to an
# API path that does not exist gets a JSON error instead of the landing page's
# HTML 404. /openapi.json is the conventional path of the OpenAPI document. Its
# pattern ends in * because a pattern without * does not match a query string.
[[routes]]
pattern = "www.ratesapi.nz/api"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "www.ratesapi.nz/api/*"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "www.ratesapi.nz/openapi"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "www.ratesapi.nz/openapi/*"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "www.ratesapi.nz/openapi.json*"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "ratesapi.nz/api"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "ratesapi.nz/api/*"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "ratesapi.nz/openapi"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "ratesapi.nz/openapi/*"
zone_name = "ratesapi.nz"

[[routes]]
pattern = "ratesapi.nz/openapi.json*"
zone_name = "ratesapi.nz"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
ENVIRONMENT = "production"

# Production D1 Database Configuration
[[d1_databases]]
binding = "RATESAPI_DB"
database_name = "ratesapi-data"
database_id = "a1156f15-7043-4616-98de-c5f2d2d3ac63"

# Development environment configuration
[env.development]
[env.development.vars]
ENVIRONMENT = "development"

# Development D1 Database Configuration
[[env.development.d1_databases]]
binding = "RATESAPI_DB"
database_name = "ratesapi-data"
database_id = "a1156f15-7043-4616-98de-c5f2d2d3ac63"
remote = true
